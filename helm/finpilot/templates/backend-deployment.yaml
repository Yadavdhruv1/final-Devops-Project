apiVersion: apps/v1
kind: Deployment
metadata:
  name: finpilot-backend
  labels:
    {{- include "finpilot.backend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: finpilot-backend
  template:
    metadata:
      labels:
        app: finpilot-backend
        component: backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: finpilot-secrets
                  key: database-url
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: finpilot-config
                  key: cors-origins
          livenessProbe:
            {{- toYaml .Values.backend.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.backend.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
