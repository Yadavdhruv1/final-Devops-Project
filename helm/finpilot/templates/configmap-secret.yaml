apiVersion: v1
kind: Secret
metadata:
  name: finpilot-secrets
type: Opaque
stringData:
  database-url: {{ .Values.backend.env.DATABASE_URL | quote }}
  postgres-user: {{ .Values.postgresql.auth.username | quote }}
  postgres-password: {{ .Values.postgresql.auth.password | quote }}
  postgres-db: {{ .Values.postgresql.auth.database | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: finpilot-config
data:
  cors-origins: {{ .Values.backend.env.CORS_ORIGINS | quote }}
