apiVersion: v1
kind: Service
metadata:
  name: finpilot-backend
  labels:
    {{- include "finpilot.backend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    app: finpilot-backend
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: 8000
      protocol: TCP
      name: http
