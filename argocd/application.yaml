# ─── FinPilot ArgoCD Application ───
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: finpilot
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/Yadavdhruv1/final-Devops-Project.git
    targetRevision: main
    path: helm/finpilot

  destination:
    server: https://kubernetes.default.svc
    namespace: finpilot

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
