# ─── FinPilot Docker Compose ───
# Starts frontend, backend, and PostgreSQL with one command

services:
  # ─── PostgreSQL Database ───
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finpilot_secret}
      POSTGRES_DB: ${POSTGRES_DB:-finpilot}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - finpilot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finpilot} -d ${POSTGRES_DB:-finpilot}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── FastAPI Backend ───
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-finpilot}:${POSTGRES_PASSWORD:-finpilot_secret}@db:5432/${POSTGRES_DB:-finpilot}
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - finpilot-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── React Frontend (Nginx) ───
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - finpilot-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
    name: finpilot-pgdata

networks:
  finpilot-network:
    name: finpilot-network
    driver: bridge
